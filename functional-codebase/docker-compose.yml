services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://pp_user:pp_password@db:5432/pp_indexer
      FILE_STORAGE_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - manuscript_files:/app/uploads

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pp_user
      POSTGRES_PASSWORD: pp_password
      POSTGRES_DB: pp_indexer
    ports:
      - "127.0.0.1:5432:5432" # published so tests and npm scripts on the host can connect
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pp_user -d pp_indexer"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  manuscript_files:
  pg_data:
